<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FZ SMS Box</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0b141a;
      --panel: #111b21;
      --head: #202c33;
      --line: #26343c;
      --text: #e9edef;
      --muted: #8696a0;
      --green: #00a884;
      --bubble: #005c4b;
      --bubble2: #202c33;
      --blue: #53bdeb
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: #0b141a;
      color: var(--text);
      height: 100vh;
      overflow: hidden
    }

    button,
    input,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .hidden {
      display: none !important
    }

    .app {
      height: 100vh;
      display: flex;
      max-width: 1500px;
      margin: auto;
      background: var(--panel);
      box-shadow: 0 0 40px #0008
    }

    .sidebar {
      width: 370px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      background: var(--panel)
    }

    .top {
      height: 64px;
      background: var(--head);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #00a884, #087f69);
      font-weight: 900
    }

    .iconbtn {
      border: 0;
      background: transparent;
      color: #d1d7db;
      font-size: 21px;
      padding: 7px;
      border-radius: 50%
    }

    .iconbtn:hover {
      background: #ffffff12
    }

    .search {
      padding: 8px 12px;
      border-bottom: 1px solid var(--line)
    }

    .search input,
    .auth input,
    .profile input,
    .profile textarea {
      width: 100%;
      border: 0;
      outline: 0;
      background: #202c33;
      color: var(--text);
      border-radius: 9px;
      padding: 12px
    }

    .chatitem {
      padding: 12px 16px;
      display: flex;
      gap: 13px;
      align-items: center;
      border-bottom: 1px solid #1c292f;
      cursor: pointer
    }

    .chatitem:hover,
    .chatitem.active {
      background: #202c33
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #55656e;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex: none;
      font-weight: 700
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .chatmeta {
      min-width: 0;
      flex: 1
    }

    .name {
      font-size: 16px
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .header {
      height: 64px;
      background: var(--head);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px
    }

    .peer {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0
    }

    .peer .avatar {
      width: 42px;
      height: 42px
    }

    .peertext {
      min-width: 0
    }

    .peertext .sub {
      margin: 0
    }

    .tools {
      display: flex;
      gap: 3px
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 22px 6%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: #0b141a;
      background-image: radial-gradient(#202c33 1px, transparent 0);
      background-size: 24px 24px
    }

    .messages.wall {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat
    }

    .msg {
      max-width: min(72%, 650px);
      padding: 7px 9px 5px;
      border-radius: 9px;
      position: relative;
      word-wrap: break-word
    }

    .msg.me {
      align-self: flex-end;
      background: var(--bubble)
    }

    .msg.other {
      align-self: flex-start;
      background: var(--bubble2)
    }

    .body {
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap
    }

    .meta {
      float: right;
      color: #aebac1;
      font-size: 11px;
      margin: 5px 0 0 10px
    }

    .seen {
      color: #53bdeb
    }

    .media {
      max-width: 360px;
      max-height: 360px;
      border-radius: 7px;
      display: block
    }

    .reply {
      border-left: 4px solid #53bdeb;
      background: #0002;
      padding: 5px 8px;
      margin-bottom: 5px;
      border-radius: 5px;
      font-size: 12px
    }

    .actions {
      display: flex;
      gap: 5px;
      position: absolute;
      right: 5px;
      top: calc(100% + 3px);
      background: #23343d;
      padding: 5px;
      border-radius: 7px;
      z-index: 5
    }

    .actions button {
      border: 0;
      background: transparent;
      color: #ddd;
      font-size: 12px
    }

    .composer {
      min-height: 62px;
      background: var(--head);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      position: relative
    }

    .composer input {
      flex: 1;
      border: 0;
      outline: 0;
      background: #2a3942;
      color: var(--text);
      border-radius: 22px;
      padding: 12px 15px
    }

    .round {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #2a3942;
      color: #d1d7db
    }

    .send {
      background: var(--green);
      color: #06251e
    }

    .menu {
      position: absolute;
      bottom: 58px;
      left: 10px;
      background: #23343d;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 10px 30px #0008;
      z-index: 20
    }

    .menu button {
      display: block;
      width: 210px;
      text-align: left;
      padding: 10px;
      border: 0;
      background: transparent;
      color: #eee;
      border-radius: 7px
    }

    .menu button:hover {
      background: #ffffff12
    }

    .emoji {
      width: 310px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      max-height: 230px;
      overflow: auto
    }

    .emoji button {
      font-size: 23px;
      padding: 5px
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #0009;
      display: grid;
      place-items: center;
      z-index: 100
    }

    .card {
      width: min(430px, 92vw);
      background: #202c33;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 15px 60px #000
    }

    .auth {
      text-align: center
    }

    .auth h1 {
      margin: 0 0 8px;
      color: var(--green)
    }

    .auth p {
      color: var(--muted)
    }

    .auth input {
      margin: 7px 0
    }

    .primary {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #06251e;
      font-weight: 700;
      margin-top: 8px
    }

    .small {
      font-size: 12px;
      color: var(--muted)
    }

    .call {
      position: fixed;
      inset: 0;
      background: #081014;
      z-index: 200;
      display: flex;
      flex-direction: column
    }

    .callhead {
      padding: 14px;
      display: flex;
      justify-content: space-between
    }

    .videos {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center
    }

    .remote {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000
    }

    .local {
      position: absolute;
      width: 180px;
      height: 130px;
      right: 18px;
      bottom: 18px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #fff5
    }

    .callcontrols {
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 14px
    }

    .callcontrols button {
      border: 0;
      border-radius: 50%;
      width: 54px;
      height: 54px;
      font-size: 22px;
      background: #33434b;
      color: white
    }

    .callcontrols .end {
      background: #e74c3c
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: #26343c;
      padding: 10px 15px;
      border-radius: 8px;
      z-index: 500;
      display: none
    }

    .back {
      display: none
    }

    @media(max-width:800px) {
      .app {
        height: 100vh
      }

      .sidebar {
        width: 100%
      }

      .main {
        position: absolute;
        inset: 0;
        display: none
      }

      .app.chat-open .sidebar {
        display: none
      }

      .app.chat-open .main {
        display: flex
      }

      .back {
        display: inline-block
      }

      .msg {
        max-width: 86%
      }

      .messages {
        padding: 15px 3%
      }

      .local {
        width: 125px;
        height: 95px;
        right: 10px;
        bottom: 10px
      }

      .header {
        height: 58px
      }

      .sidebar .top {
        height: 58px
      }
    }
  </style>
</head>

<body>
  <div id="login" class="modal">
    <div class="card auth">
      <div class="logo" style="margin:auto">FZ</div>
      <h1>FZ SMS Box</h1>
      <p>Private realtime chat • Testing version</p><input id="loginName" placeholder="Apna naam"
        autocomplete="name"><input id="password" type="password" placeholder="Screen Password"
        autocomplete="current-password"><button class="primary" onclick="loginUser()">Enter Chat</button>
      <div id="loginMsg" class="small"></div>
      <p class="small">Maximum 10 users. Koi username ya mobile number nahi chahiye.</p>
    </div>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="top">
        <div class="brand">
          <div id="myAvatar" class="avatar">FZ</div>
          <div>
            <div>FZ SMS Box</div>
            <div class="small" id="myNumber"></div>
          </div>
        </div>
        <div><button class="iconbtn" onclick="openProfile()">⚙️</button></div>
      </div>
      <div class="search"><input id="search" placeholder="Search by name"
          onkeydown="if(event.key==='Enter')searchUser()"></div>
      <div id="chatList"></div>
    </aside>
    <main class="main">
      <div class="header">
        <div class="peer"><button class="iconbtn back" onclick="closeChat()">←</button>
          <div id="peerAvatar" class="avatar">?</div>
          <div class="peertext">
            <div id="peerName" class="name">Select a contact</div>
            <div id="peerStatus" class="sub">Search a name to start</div>
          </div>
        </div>
        <div class="tools"><button class="iconbtn" onclick="startCall('audio')">📞</button><button class="iconbtn"
            onclick="startCall('video')">📹</button><button class="iconbtn"
            onclick="openWallpaper()">🖼️</button><button class="iconbtn" onclick="blockCurrent()">🚫</button></div>
      </div>
      <div id="messages" class="messages">
        <div style="margin:auto;text-align:center;color:#8696a0">🔒 Private chat<br><small>Messages are stored per
            conversation.</small></div>
      </div>
      <div id="replyBar" class="hidden" style="background:#202c33;padding:8px 14px;border-left:4px solid #53bdeb">↩️
        <span id="replyText"></span><button class="iconbtn" onclick="cancelReply()" style="float:right">✕</button></div>
      <div class="composer"><button class="round" onclick="toggleEmoji()">😀</button><button class="round"
          onclick="toggleAttach()">📎</button><input id="input" placeholder="Type a message..." oninput="typing()"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"><button class="round"
          id="mic" onclick="toggleVoice()">🎤</button><button class="round send" onclick="sendText()">➤</button>
        <div id="emojiMenu" class="menu hidden emoji"></div>
        <div id="attachMenu" class="menu hidden"><button onclick="pickFile('image/*')">🖼️ Photo</button><button
            onclick="pickFile('video/*')">🎬 Video</button><button onclick="pickFile('*/*')">📄 Document</button></div>
        <input id="file" type="file" hidden onchange="sendFile()">
      </div>
    </main>
  </div>
  <div id="profileModal" class="modal hidden">
    <div class="card profile">
      <h2>Profile</h2><input id="profileName" placeholder="Your name"><textarea id="profileAbout" rows="3"
        placeholder="About"></textarea><input id="profileAvatar" type="file" accept="image/*"
        onchange="previewAvatar()"><button class="primary" onclick="saveProfile()">Save</button><button class="iconbtn"
        onclick="closeProfile()">Close</button>
      <hr><button class="primary" style="background:#c0392b;color:#fff" onclick="logout()">Log out</button>
    </div>
  </div>
  <div id="incoming" class="modal hidden">
    <div class="card auth">
      <h2 id="incomingTitle">Incoming call</h2>
      <p id="incomingType"></p><button class="primary" onclick="acceptCall()">✅ Accept</button><button class="primary"
        style="background:#c0392b;color:white" onclick="rejectCall()">❌ Reject</button>
    </div>
  </div>
  <div id="call" class="call hidden">
    <div class="callhead">
      <div id="callTitle">Calling...</div>
      <div id="callState" class="small"></div>
    </div>
    <div class="videos"><video id="remoteVideo" class="remote" autoplay playsinline></video><video id="localVideo"
        class="local" autoplay muted playsinline></video></div>
    <div class="callcontrols"><button onclick="toggleMute()">🎤</button><button
        onclick="toggleCamera()">📷</button><button class="end" onclick="endCall()">📞</button></div>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    const socket = io();

    socket.on('connect', () => {const m = $('loginMsg'); if (m && $('login').classList.contains('hidden') === false) m.textContent = 'Connected — enter your details.'}); socket.on('connect_error', e => {const m = $('loginMsg'); if (m) m.textContent = 'Server connection failed. Please wait and try again.'}); let me = null, tokenKey = 'fz_session', current = null, reply = null, typingTimer, recorder = null, chunks = [], pc, localStream, remotePhone, incomingData, currentCallType = 'video', pendingIce = []; const $ = id => document.getElementById(id);
    const EMOJIS = '😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 🤗 🤔 🫡 🤭 🤫 😐 😑 😬 🙄 😮 😲 😴 🤤 😪 🤖 👻 💀 👽 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 ❤️‍🔥 💯 🔥 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👋 🙏 💪 👏 🙌 🫶 💕 💖 💗 💓 💞 💘 🎉 🎊 🚀 ⭐ 🌟 ✨ ⚡ ☀️ 🌈 🍕 🍔 🍟 🌮 🍎 ☕ 🎂 ⚽ 🏏 🎮 🎵 📱 💻 💰 ✅ ❌ ❗ ❓'.split(' ');
    EMOJIS.forEach(e => {const b = document.createElement('button'); b.className = 'iconbtn'; b.textContent = e; b.onclick = () => {$('input').value += e; $('input').focus()}; $('emojiMenu').appendChild(b)});
    function toast(t) {$('toast').textContent = t; $('toast').style.display = 'block'; clearTimeout(window.tt); window.tt = setTimeout(() => $('toast').style.display = 'none', 3000)}
    function loginUser() {
      const name = $('loginName').value.trim();
      const password = $('password').value;

      if (!name) {
        $('loginMsg').textContent = 'Apna naam likho.';
        return;
      }

      if (!password) {
        $('loginMsg').textContent = 'Screen password likho.';
        return;
      }

      $('loginMsg').textContent = 'Connecting...';

      const sendLogin = () => {
        socket.emit('login', {name, password});
      };

      if (!socket.connected) {
        socket.connect();
        setTimeout(sendLogin, 500);
      } else {
        sendLogin();
      }
    }
    socket.on('login-error', m => {$('loginMsg').textContent = m; toast(m)})
    function boot(data) {me = data.user; localStorage.setItem(tokenKey, data.token); $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('myNumber').textContent = 'Online'; renderAvatar($('myAvatar'), me); $('profileName').value = me.name; $('profileAbout').value = me.about;}
    socket.on('login-ok', boot); socket.on('session-invalid', () => localStorage.removeItem(tokenKey)); const saved = localStorage.getItem(tokenKey); if (saved) socket.emit('resume-session', saved);
    function renderAvatar(el, u) {el.innerHTML = u?.avatar ? `<img src="${u.avatar}">` : (u?.name || 'U').slice(0, 2).toUpperCase()}
    function searchUser() {
      const name = $('search').value.trim();
      if (!name) return;
      socket.emit('search-user', name);
    }

    socket.on('search-results', (users) => {
      if (!users.length) return toast('User not found');
      users.forEach((user) => addChat(user));
      openChat(users[0].username);
    });
    function addChat(u) {
      const id = 'c' + btoa(u.username).replace(/=/g, '');
      let el = document.getElementById(id);

      if (!el) {
        el = document.createElement('div');
        el.className = 'chatitem';
        el.id = id;
        $('chatList').prepend(el);
      }

      el.onclick = () => openChat(u.username);
      el.innerHTML = `
    <div class="avatar" id="a${id}"></div>
    <div class="chatmeta">
      <div class="name">${esc(u.name)}</div>
      <div class="sub">${u.online ? 'online' : 'offline'}</div>
    </div>`;

      renderAvatar($('a' + id), u);
    }
    function openChat(username) {socket.emit('get-chat', username)} socket.on('chat-history', d => {current = d.other; addChat(d.user); $('app').classList.add('chat-open'); $('peerName').textContent = d.user.name; $('peerStatus').textContent = d.user.online ? 'online' : d.user.lastSeen ? 'last seen ' + new Date(d.user.lastSeen).toLocaleString() : 'offline'; renderAvatar($('peerAvatar'), d.user); $('messages').innerHTML = ''; (d.messages || []).forEach(renderMsg); scrollDown()})
    function closeChat() {$('app').classList.remove('chat-open'); current = null}
    function sendText() {if (!current) return toast('Select a contact first'); const text = $('input').value.trim(); if (!text) return; socket.emit('chat-message', {to: current, text, replyTo: reply ? {id: reply.id, text: reply.text, from: reply.from} : null}); $('input').value = ''; cancelReply(); socket.emit('typing', {to: current, typing: false})}
    function sendFile() {if (!current) return; const f = $('file').files[0]; if (!f) return; if (f.size > 12 * 1024 * 1024) return toast('File must be under 12 MB'); const r = new FileReader(); r.onload = () => socket.emit('chat-message', {to: current, text: '', mediaType: f.type.startsWith('image/') ? 'image' : f.type.startsWith('video/') ? 'video' : 'document', fileData: r.result, fileName: f.name}); r.readAsDataURL(f); $('file').value = ''}
    function pickFile(a) {$('file').accept = a; $('file').click(); toggleAttach()}
    function toggleEmoji() {$('emojiMenu').classList.toggle('hidden'); $('attachMenu').classList.add('hidden')} function toggleAttach() {$('attachMenu').classList.toggle('hidden'); $('emojiMenu').classList.add('hidden')}
    function typing() {if (!current) return; socket.emit('typing', {to: current, typing: true}); clearTimeout(typingTimer); typingTimer = setTimeout(() => socket.emit('typing', {to: current, typing: false}), 1200)} socket.on('typing', d => {if (d.from === current) $('peerStatus').textContent = d.typing ? 'typing...' : 'online'})
    function renderMsg(m) {const div = document.createElement('div'); div.className = 'msg ' + (m.from === me.username ? 'me' : 'other'); div.id = 'm' + m.id; let content = m.deleted ? '🚫 This message was deleted' : esc(m.text); if (m.mediaType === 'image' && m.fileData) content = `<img class="media" src="${m.fileData}">`; if (m.mediaType === 'video' && m.fileData) content = `<video class="media" src="${m.fileData}" controls></video>`; if (m.mediaType === 'audio' && m.fileData) content = `<audio src="${m.fileData}" controls></audio>`; if (m.mediaType === 'document' && m.fileData) content = `📄 <a style="color:#53bdeb" href="${m.fileData}" download="${esc(m.fileName || 'file')}">${esc(m.fileName || 'Document')}</a>`; const rep = m.replyTo ? `<div class="reply">↩️ ${esc(m.replyTo.text || 'Message')}</div>` : ''; div.innerHTML = `${rep}<div class="body">${content}</div><span class="meta">${new Date(m.sentAt).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}${m.edited ? ' · edited' : ''} ${m.from === me.username ? (m.seen ? ' <span class="seen">✓✓</span>' : ' ✓') : ''} ${m.starred ? ' ⭐' : ''}</span>`; div.oncontextmenu = e => {e.preventDefault(); messageMenu(m)}; $('messages').appendChild(div); if (m.to === me.username && !m.seen) socket.emit('message-action', {other: m.from, id: m.id, action: 'seen'})}
    socket.on('chat-message', m => {if (m.from === current || m.to === current) {renderMsg(m); scrollDown()} else {const u = {username: m.from, name: m.from}; addChat(u); toast('New message from @' + m.from)} }); socket.on('message-updated', m => {const el = $('m' + m.id); if (el) {el.remove(); renderMsg(m); scrollDown()} })
    function messageMenu(m) {const old = document.querySelector('.actions'); if (old) old.remove(); const a = document.createElement('div'); a.className = 'actions'; const items = [['↩️', 'Reply', () => {reply = m; $('replyText').textContent = m.text || 'Media'; $('replyBar').classList.remove('hidden')}], ['📋', 'Copy', () => navigator.clipboard?.writeText(m.text || '')], ['⭐', 'Star', () => socket.emit('message-action', {other: current, id: m.id, action: 'star'})]]; if (m.from === me.username && !m.deleted) {items.push(['✏️', 'Edit', () => {const t = prompt('Edit message', m.text); if (t !== null) socket.emit('message-action', {other: current, id: m.id, action: 'edit', text: t})}]); items.push(['🗑️', 'Delete', () => socket.emit('message-action', {other: current, id: m.id, action: 'delete'})]);} items.forEach(x => {const b = document.createElement('button'); b.textContent = x[0] + ' ' + x[1]; b.onclick = () => {a.remove(); x[2]()}; a.appendChild(b)}); document.body.appendChild(a); const r = $('m' + m.id).getBoundingClientRect(); a.style.left = Math.min(r.left, innerWidth - 260) + 'px'; a.style.top = Math.min(r.bottom, innerHeight - 80) + 'px'}
    function cancelReply() {reply = null; $('replyBar').classList.add('hidden')}; function scrollDown() {$('messages').scrollTop = $('messages').scrollHeight}; function esc(s) {return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]))}
    function openProfile() {$('profileModal').classList.remove('hidden')}; function closeProfile() {$('profileModal').classList.add('hidden')}; let avatarData = ''; function previewAvatar() {const f = $('profileAvatar').files[0]; if (!f) return; const r = new FileReader(); r.onload = () => avatarData = r.result; r.readAsDataURL(f)} function saveProfile() {socket.emit('update-profile', {name: $('profileName').value, about: $('profileAbout').value, avatar: avatarData || me.avatar}); closeProfile()} socket.on('profile-updated', u => {me = u; renderAvatar($('myAvatar'), u); $('myNumber').textContent = 'Online'});
    function blockCurrent() {if (!current) return toast('Select a contact'); if (confirm('Block @' + current + '? They will not be able to use this chat with you.')) socket.emit('block-user', current)} socket.on('user-blocked', d => toast('Blocked ' + d.username)); socket.on('blocked-by-admin', () => {alert('Your account has been blocked.'); logout()});
    function logout() {localStorage.removeItem(tokenKey); location.reload()}; function openWallpaper() {const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => {const r = new FileReader(); r.onload = () => {localStorage.setItem('fz_wallpaper', r.result); applyWall(r.result)}; r.readAsDataURL(i.files[0])}; i.click()} function applyWall(x) {$('messages').style.backgroundImage = x ? `url("${x}")` : ''; $('messages').classList.toggle('wall', !!x)} const wp = localStorage.getItem('fz_wallpaper'); if (wp) applyWall(wp);
    async function setupPC() {pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}, {urls: 'stun:stun1.l.google.com:19302'}]}); pc.onicecandidate = e => e.candidate && socket.emit('ice-candidate', {to: remotePhone, candidate: e.candidate}); pc.ontrack = e => {if (!$('remoteVideo').srcObject) $('remoteVideo').srcObject = new MediaStream(); $('remoteVideo').srcObject.addTrack(e.track); $('remoteVideo').play().catch(() => { })}; pc.onconnectionstatechange = () => {$('callState').textContent = pc.connectionState}; if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream)); while (pendingIce.length) {try {await pc.addIceCandidate(pendingIce.shift())} catch (e) { } } }
    async function startCall(type) {if (!current) return toast('Select a contact'); try {remotePhone = current; currentCallType = type; localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: type === 'video'}); $('localVideo').srcObject = localStream; $('remoteVideo').srcObject = null; $('callTitle').textContent = 'Calling ' + current; $('call').classList.remove('hidden'); await setupPC(); const offer = await pc.createOffer(); await pc.setLocalDescription(offer); socket.emit('call-user', {to: remotePhone, offer: pc.localDescription, type});} catch (e) {toast('Camera/mic permission failed: ' + e.message); closeCall()} }
    socket.on('incoming-call', d => {incomingData = d; $('incomingTitle').textContent = d.fromName || d.from; $('incomingType').textContent = d.type === 'video' ? '📹 Video call' : '📞 Audio call'; $('incoming').classList.remove('hidden')})
    async function acceptCall() {remotePhone = incomingData.from; currentCallType = incomingData.type; $('incoming').classList.add('hidden'); $('callTitle').textContent = 'Connected to ' + (incomingData.fromName || remotePhone); $('call').classList.remove('hidden'); try {localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: currentCallType === 'video'}); $('localVideo').srcObject = localStream; await setupPC(); await pc.setRemoteDescription(incomingData.offer); const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); socket.emit('make-answer', {to: remotePhone, answer: pc.localDescription})} catch (e) {toast(e.message); closeCall()} }
    function rejectCall() {if (incomingData) socket.emit('reject-call', {to: incomingData.from}); $('incoming').classList.add('hidden'); incomingData = null} socket.on('call-accepted', async d => {if (pc && d.answer) {await pc.setRemoteDescription(d.answer); while (pendingIce.length) await pc.addIceCandidate(pendingIce.shift())} }); socket.on('ice-candidate', async d => {if (d.from !== remotePhone) return; const c = new RTCIceCandidate(d.candidate); if (pc?.remoteDescription?.type) await pc.addIceCandidate(c); else pendingIce.push(c)}); socket.on('call-ended', () => {toast('Call ended'); closeCall()}); socket.on('call-rejected', () => {toast('Call rejected'); closeCall()}); socket.on('call-error', m => {toast(m); closeCall()}); function toggleMute() {const t = localStream?.getAudioTracks()[0]; if (t) t.enabled = !t.enabled} function toggleCamera() {const t = localStream?.getVideoTracks()[0]; if (t) t.enabled = !t.enabled} function endCall() {if (remotePhone) socket.emit('end-call', {to: remotePhone}); closeCall()} function closeCall() {if (pc) {pc.close(); pc = null} localStream?.getTracks().forEach(t => t.stop()); localStream = null; $('call').classList.add('hidden'); $('localVideo').srcObject = null; $('remoteVideo').srcObject = null; pendingIce = []}
    async function toggleVoice() {if (!current) return toast('Select a contact first'); if (recorder && recorder.state === 'recording') {recorder.stop(); return } try {const stream = await navigator.mediaDevices.getUserMedia({audio: true}); chunks = []; recorder = new MediaRecorder(stream); recorder.ondataavailable = e => e.data.size && chunks.push(e.data); recorder.onstop = () => {const blob = new Blob(chunks, {type: 'audio/webm'}); stream.getTracks().forEach(t => t.stop()); const r = new FileReader(); r.onload = () => socket.emit('chat-message', {to: current, text: '🎤 Voice message', mediaType: 'audio', fileData: r.result, fileName: 'voice.webm'}); r.readAsDataURL(blob); $('mic').textContent = '🎤'}; recorder.start(); $('mic').textContent = '⏹️'; toast('Recording... tap mic again to send')} catch (e) {toast('Microphone permission failed: ' + e.message)} }
    window.addEventListener('beforeunload', () => socket.disconnect());
  </script>
